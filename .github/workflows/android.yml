name: Build Display Launcher APK
on:
  push:
    branches: [display-launcher-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayLauncher-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
