plugins { id 'com.android.application' }

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

android {
    namespace 'com.alxt.SoundPad'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alxt.SoundPad'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '2.5'
    }

    buildTypes {
        release {
            // Installable release-variant build; uses the standard debug key for this test build.
            // Replace with a private release keystore before publishing to an app store.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
