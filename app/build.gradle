plugins { id 'com.android.application' }

android {
    namespace 'com.alxt.SoundPad'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jdjd.displaylauncher'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
