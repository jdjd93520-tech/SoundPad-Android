plugins { id 'com.android.application' }

android {
    namespace 'com.alxt.SoundPad'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alxt.SoundPad'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '2.7'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}