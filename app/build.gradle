plugins { id 'com.android.application' }

android {
    namespace 'com.alxt.SoundPad'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alxt.SoundPad'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            // Installable release-variant build; uses the standard debug key for this test build.
            // Replace with a private release keystore before publishing to an app store.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
